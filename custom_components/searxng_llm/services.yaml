search:
  name: SearXNG 搜索
  description: 调用 SearXNG JSON 接口执行联网搜索，返回结果的标题、链接与摘要。
  fields:
    query:
      name: 搜索关键词
      description: 要搜索的关键词或问题；也可传列表，一次并行搜索多个关键词（并发受集成「并行搜索数量」限制）。
      required: true
      example: home assistant 最新版本
      selector:
        text: {}
    language:
      name: 搜索语言
      description: SearXNG 的 language 参数：auto=自动识别、all=全部语言，或语言代码如 zh-CN、zh、en-US。缺省使用集成配置的搜索语言。
      required: false
      example: zh-CN
      selector:
        text: {}
fetch:
  name: 抓取网页
  description: 抓取指定网页地址的正文内容，供模型在搜索后按需打开链接（AI 智能抓取）。
  fields:
    url:
      name: 网页地址
      description: 要抓取的 http/https 网页地址；也可传列表，一次并行抓取多个（并发受集成「并行抓取数量」限制）。
      required: true
      example: https://example.com/article
      selector:
        text: {}
